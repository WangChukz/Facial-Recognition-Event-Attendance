services:
  # ── Backend (FastAPI + AI) ──────────────────────────────────────────────
  - type: web
    name: bav-backend
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bav-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: https://bav-frontend.onrender.com
      - key: FAISS_INDEX_PATH
        value: /app/faiss_indexes/faces.index
      - key: FAISS_META_PATH
        value: /app/faiss_indexes/faces_meta.json
      - key: INSIGHTFACE_HOME
        value: /app/ai_models
      - key: INSIGHTFACE_CTX_ID
        value: "-1"
      - key: ONNX_PROVIDERS
        value: CPUExecutionProvider
      - key: RECOGNITION_THRESHOLD
        value: "0.45"
      - key: UNKNOWN_THRESHOLD
        value: "0.35"
      - key: DEDUPE_WINDOW_SECONDS
        value: "120"
      - key: DET_SIZE_WIDTH
        value: "320"
      - key: DET_SIZE_HEIGHT
        value: "320"

  # ── Frontend (React / Vite) ─────────────────────────────────────────────
  - type: web
    name: bav-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://bav-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ── PostgreSQL Database ─────────────────────────────────────────────────
databases:
  - name: bav-postgres
    plan: free
    databaseName: attendance
    user: postgres
